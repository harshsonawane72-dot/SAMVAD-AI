<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAMVAD AI Prototype | Simulated Analysis</title>
  <link rel="stylesheet" href="../main.css">
</head>
<body>
  <!-- Simulated AI Analysis results (decision support — not a diagnosis) -->
  <main id="analysis">
    <h1>Simulated AI Analysis</h1>
    <p class="disclaimer">
      Advisory output only. Not a clinical diagnosis. Not an autonomous legal or emergency decision.
    </p>

    <!-- Stress Vulnerability Index (SVI) -->
    <section id="svi">
      <h2>Stress Vulnerability Index (SVI)</h2>
      <!-- Simulated SVI score display -->
    </section>

    <!-- Risk Level -->
    <section id="risk-level">
      <h2>Risk Level</h2>
      <!-- Low / Moderate / High (demo labels) -->
    </section>

    <!-- Detected Indicators -->
    <section id="indicators">
      <h2>Detected Indicators</h2>
      <!-- Keyword / pattern-based demo indicators -->
    </section>

    <!-- Support Recommendations -->
    <section id="recommendations">
      <h2>Support Recommendations</h2>
      <!-- Suggested next steps for human operators -->
    </section>
  </main>
  <script src="../demo-data.js"></script>
  <script src="../simulate-ai.js"></script>
  <script src="../main.js"></script>
</body>
</html>
